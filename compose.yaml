services:
  nginx:
    image: nginx:alpine
    container_name: payforge-nginx
    ports:
      - "8080:80"
    volumes:
      - ./apps/api:/var/www/html
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - payforge

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: payforge-api
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
      - api_vendor:/var/www/html/vendor
    env_file:
      - ./apps/api/.env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      MAIL_HOST: mailpit
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - payforge

  queue:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: payforge-queue
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./apps/api:/var/www/html
      - api_vendor:/var/www/html/vendor
    env_file:
      - ./apps/api/.env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      MAIL_HOST: mailpit
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - payforge

  provider-service:
    build:
      context: .
      dockerfile: apps/provider-service/Dockerfile
    container_name: payforge-provider-service
    ports:
          - "3001:3001"
    volumes:
      - ./apps/provider-service:/app
      - provider_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3001
      API_BASE_URL: http://nginx
    depends_on:
      - nginx
    networks:
      - payforge

  mysql:
    image: mysql:8.4
    container_name: payforge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-payforge}
      MYSQL_USER: ${DB_USERNAME:-payforge}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -uroot
        - -p${DB_ROOT_PASSWORD:-root}
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - payforge

  redis:
    image: redis:7-alpine
    container_name: payforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - payforge

  mailpit:
    image: axllent/mailpit:latest
    container_name: payforge-mailpit
    ports:
      - "8025:8025"
    networks:
      - payforge

volumes:
  mysql_data:
  redis_data:
  api_vendor:
  provider_node_modules:

networks:
  payforge:
    driver: bridge
